name: Flutter

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly iOS build (macOS runners cost about ten times Linux minutes).
    - cron: "23 6 * * 2"
  workflow_dispatch:


# Read-only token: analysis, tests and builds publish nothing.
permissions:
  contents: read

jobs:
  client:
    # Shared MNSCloud Flutter client gate (docs/flutter-client-standard.md in the workspace):
    # pinned toolchain, native configuration check, analyze, test and one build per target.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/flutter-client-ci.yml@main
    with:
      targets: "android,ios"
      native_check_args: >-
        --android-permission ACCESS_FINE_LOCATION --android-permission ACCESS_COARSE_LOCATION
        --android-permission CAMERA
        --ios-plist-key NSLocationWhenInUseUsageDescription --ios-plist-key NSCameraUsageDescription
      # maplibre_gl's Android build uses JDK 21.
      java_version: "21"
      apple: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  analyze-test:
    # Required status check of main: the shared gate passed and the public client names no
    # real platform domain.
    needs: client
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.client.result }}" = success
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: No real platform domains in the public client
        run: |
          if grep -RInE 'publichost\.cloud' lib test docs README.md; then
            echo "Use placeholders instead of platform domains (docs/public-api-clients.md)."
            exit 1
          fi

  sonarcloud:
    # SonarQube Cloud CI analysis (Dart is not covered by automatic analysis); shared and pinned in
    # mnscloud-runtime-kit. Skipped with a notice while SONAR_TOKEN is not available.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/sonarcloud-dart.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    # Shared security gate (Gitleaks, Trivy, Opengrep), pinned in mnscloud-runtime-kit.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/security-scan.yml@main
    with:
      # No Dart rule set in opengrep-rules: scan scripts only.
      opengrep_rules: "bash"
      opengrep_exclude: "test"
