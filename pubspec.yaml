name: mnscloud_infragis_mobile
description: Public Flutter offline-first field client for MNSCloud InfraGIS.
publish_to: none
version: 0.1.16

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.10.1
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  web: ^1.1.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Protomaps light flavor (same as the App) for the platform PMTiles base map.
    - assets/map/protomaps-light.json

# Encrypted local database: SQLite3MultipleCiphers bundled by package:sqlite3 (key from secure storage).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
